[project]
name = "watch-demo"
version = "0.1.0"
description = "Demo-only smartwatch view of the air quality agent's notifications"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "uvicorn>=0.29",
]

[project.scripts]
watch-demo = "watch_demo.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watch_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
