[project]
name = "aqagent"
version = "0.1.0"
description = "Proactive air quality insight agent (demo scope)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2",
    "pydantic>=2",
    "httpx",
    "fastapi",
    "uvicorn",
    "apscheduler>=3.10,<4",
    "pyyaml",
]

[project.optional-dependencies]
llm = ["anthropic"]
eval = ["ruptures", "numpy"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqagent"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
